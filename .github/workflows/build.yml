name: Gerar instalador do Scap
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MCScan3D
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Gerar Scap.exe
        run: >
          python -m PyInstaller --onefile --windowed --name Scap
          --icon gui_assets/emblema.ico
          --add-data "gui_assets;gui_assets"
          --add-data "visualizador.html;."
          --add-data "mcscan_leitor.js;."
          --add-data "mcscan_visualizador.js;."
          --hidden-import mapscan_gui --hidden-import mapscan_ui --hidden-import mapscan_viewer
          --collect-all webview
          mcscan.py
      - name: Gerar instalador
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador\Scap.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Scap-Setup
          path: MCScan3D/saida/Scap-Setup.exe
