<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa da cidade</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("fonts/Inter-Regular.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("fonts/Inter-SemiBold.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-Bold.ttf"); }
  :root { --fundo: #0B1F16; --verde: #0B4B33; --creme: #F8EBD3; --claro: #FCF4E3; --borda: #E3D0AE; --texto: #0B4B33;
    --suave: #5C7A6B; --vermelho: #E01A13; --noite: #1B2A5C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fundo); color: var(--texto);
    font: 600 13px/1.4 "Inter", system-ui, "Segoe UI", sans-serif; }
  #mapa { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #mapa:active { cursor: grabbing; }
  .barra { position: fixed; left: 16px; right: 16px; top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    pointer-events: none; }
  .barra > * { pointer-events: auto; }
  button, label.botao { background: var(--claro); color: var(--verde); border: 2px solid var(--verde); border-radius: 12px;
    padding: 7px 13px; font: inherit; cursor: pointer; outline: none; }
  button:hover, label.botao:hover { background: var(--creme); }
  button:active { transform: translateY(1px); }
  input[type=file] { display: none; }
  #info { margin-left: auto; color: var(--verde); background: var(--claro); border: 2px solid var(--borda);
    border-radius: 12px; padding: 7px 13px; max-width: 100%; }
  .luz { position: fixed; left: 16px; bottom: 16px; background: var(--claro); border: 2px solid var(--borda); border-radius: 18px;
    padding: 12px 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 32px); }
  .luz .rosa { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; }
  .luz .dn { display: flex; flex-direction: column; gap: 6px; }
  .luz .rosa button { padding: 0; height: 34px; font-size: 16px; border-radius: 10px; }
  .luz .rosa button.on { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  .luz .rosa button { font-size: 13px; }
  .luz label { display: flex; flex-direction: column; gap: 3px; color: var(--suave); font-size: 12px; }
  .luz input[type=range] { width: 120px; accent-color: var(--verde); }
  .luz button.on { background: var(--verde); color: var(--creme); }
  .luz #btnNoite.on { background: var(--noite); border-color: var(--noite); color: #FFF5DB; }
  #aviso { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; pointer-events: none; }
  #aviso div { background: var(--claro); border: 2px solid var(--borda); border-radius: 18px; padding: 20px 24px; max-width: 460px; }
  #aviso.escondido { display: none; }
  #aviso p { margin: 6px 0 0; color: var(--suave); font-weight: 400; }
  #aviso.erro div { border-color: var(--vermelho); }
</style>
</head>
<body>
<canvas id="mapa"></canvas>
<div class="barra">
  <label class="botao">Abrir .scap<input id="arquivo" type="file" accept=".scap,.mcscan"></label>
  <button id="girarEsq" title="Girar para a esquerda">⟲</button>
  <button id="girarDir" title="Girar para a direita">⟳</button>
  <button id="recentrar" title="Enquadrar a cidade">Enquadrar</button>
  <span id="info"></span>
</div>
<div class="luz" id="luz">
  <div class="rosa" title="De que lado vem o sol">
    <span></span><button data-pos="n" title="Nascer do sol (norte)">N</button><span></span>
    <button data-pos="o" title="Pôr do sol (oeste)">O</button><button data-pos="" class="centro" title="Sol de outono (padrão)">☀</button><button data-pos="l" title="Nascer do sol (leste)">L</button>
    <span></span><button data-pos="s" title="Pôr do sol (sul)">S</button><span></span>
  </div>
  <div class="dn">
    <button id="btnDia" class="on">☀ Dia</button><button id="btnNoite" class="noite">🌙 Noite</button>
  </div>
  <div class="dn">
    <button id="animBtn" class="on" style="display:none" title="Água, lava, fogo e outras texturas em movimento">🌊 Animações</button>
    <button id="fxVento" class="on" title="Folhas e plantas balançando">🍃 Vento</button>
    <button id="fxNevoa" class="on" title="Neblina de profundidade e céu em degradê">☁ Névoa</button>
    <button id="fxBrilho" class="on" title="Brilho das luzes à noite">✨ Brilho</button>
  </div>
</div>
<div id="aviso"><div><strong id="avisoTitulo">Carregando…</strong><p id="avisoTexto"></p></div></div>

<script src="mcscan_leitor.js"></script>
<script src="mcscan_visualizador.js"></script>
<script>
  // não deixa os botões ficarem com foco (o foco fazia a janela embutida deslocar)
  document.addEventListener("click", function (e) { var t = e.target; if (t && t.tagName === "BUTTON") t.blur(); });
  document.addEventListener("pointerup", function (e) { var t = e.target; if (t && t.tagName === "INPUT" && t.type === "range") setTimeout(function () { t.blur(); }, 0); });
  window.addEventListener("scroll", function () { window.scrollTo(0, 0); });
  // Padrão: carrega "cidade.scap" da mesma pasta. Outro arquivo: visualizador.html?arquivo=nome.scap
  var ARQUIVO_PADRAO = new URLSearchParams(location.search).get("arquivo") || "cidade.scap";
  var canvas = document.getElementById("mapa"), vista = null;
  var aviso = document.getElementById("aviso");

  function mostrar(titulo, texto, erro) {
    document.getElementById("avisoTitulo").textContent = titulo;
    document.getElementById("avisoTexto").textContent = texto || "";
    aviso.className = erro ? "erro" : "";
  }
  function esconder() { aviso.className = "escondido"; }

  async function abrir(scanPromessa) {
    try {
      mostrar("Carregando a cidade…", "Baixando e descompactando. Em cidades grandes isso leva alguns segundos.");
      await new Promise(function (r) { setTimeout(r, 30); });
      var scan = await scanPromessa;
      mostrar("Preparando o mapa…", "Organizando " + (scan.cab.n_runs || 0).toLocaleString("pt-BR") + " trechos de blocos.");
      await new Promise(function (r) { setTimeout(r, 30); });
      var a = scan.cab.area;
      var texto = (a.x2 - a.x1 + 1) + " × " + (a.z2 - a.z1 + 1) + " blocos";
      var info = document.getElementById("info");
      info.textContent = texto;
      var params = new URLSearchParams(location.search);
      vista = await McScanView.criar(canvas, scan, {
        semOclusao: params.get("oclusao") === "0",
        aoQuadro: function (s) {
          var modo = s.modo === 0 ? "blocos com textura" : (s.modo === 1 ? "visão média" : "visão geral");
          info.textContent = texto + " · " + modo + (s.pendentes ? " · carregando…" : "");
        }
      });
      if (vista.temAnimacao) {
        var ab = document.getElementById("animBtn"); ab.style.display = ""; ab.classList.add("on");
        ab.onclick = function () { ab.classList.toggle("on", vista.animar(!vista.estado.animar)); };
      }
      [["fxVento", ["vento"]], ["fxNevoa", ["neblina", "ceu"]], ["fxBrilho", ["brilho"]]].forEach(function (par) {
        var bt = document.getElementById(par[0]);
        bt.onclick = function () {
          var lig = !bt.classList.contains("on"), c = {};
          par[1].forEach(function (k) { c[k] = lig; });
          vista.estilo(c); bt.classList.toggle("on", lig);
        };
      });
      esconder();
    } catch (e) {
      console.error(e);
      mostrar("Não consegui abrir o mapa", e.message || String(e), true);
    }
  }

  document.getElementById("arquivo").addEventListener("change", function (ev) {
    var f = ev.target.files[0];
    if (f) abrir(f.arrayBuffer().then(McScan.decodificar));
  });
  document.getElementById("girarEsq").onclick = function () { if (vista) vista.girar(-1); };
  document.getElementById("girarDir").onclick = function () { if (vista) vista.girar(1); };
  document.getElementById("recentrar").onclick = function () { if (vista) vista.recentrar(); };
  var luzCfg = { pos: "", noite: 0 }, luzTimer = 0;
  function aplicarLuz() {
    if (!vista) return;
    clearTimeout(luzTimer);
    luzTimer = setTimeout(function () { vista.luz({ pos: luzCfg.pos, noite: luzCfg.noite, az: 38, elev: 30 }); }, 0);
    document.querySelectorAll(".rosa button").forEach(function (b) { b.classList.toggle("on", b.dataset.pos === luzCfg.pos); });
    document.getElementById("btnDia").classList.toggle("on", !luzCfg.noite);
    document.getElementById("btnNoite").classList.toggle("on", !!luzCfg.noite);
  }
  document.querySelectorAll(".rosa button").forEach(function (b) {
    b.onclick = function () { luzCfg.pos = b.dataset.pos; aplicarLuz(); };
  });
  document.getElementById("btnDia").onclick = function () { luzCfg.noite = 0; aplicarLuz(); };
  document.getElementById("btnNoite").onclick = function () { luzCfg.noite = 1; aplicarLuz(); };
  document.querySelector('.rosa button[data-pos=""]').classList.add("on");
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    var f = e.dataTransfer.files[0];
    if (f) abrir(f.arrayBuffer().then(McScan.decodificar));
  });

  if (location.protocol === "file:") {
    mostrar("Escolha o arquivo", "Abra o arquivo .scap pelo botão (ou arraste para cá). Para carregar sozinho, a página precisa estar num servidor.");
  } else {
    abrir(McScan.carregar(ARQUIVO_PADRAO));
  }
</script>
</body>
</html>
